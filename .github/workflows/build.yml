name: Build WhatsApp Tweak

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: 🔧 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          curl \
          wget \
          build-essential \
          fakeroot \
          rsync \
          libxml2-dev \
          libssl-dev \
          libtool \
          autoconf \
          automake

    - name: 📦 Setup Theos
      run: |
        # 安装 Theos
        git clone --recursive https://github.com/theos/theos.git $THEOS

        # 配置环境变量
        echo "export THEOS=$THEOS" >> ~/.bashrc
        echo "export PATH=\$THEOS/bin:\$PATH" >> ~/.bashrc
        source ~/.bashrc

        # 验证安装
        ls -la $THEOS

    - name: 📱 Install iOS SDK
      run: |
        cd $THEOS

        # 下载 iOS SDK
        wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
        unzip -q sdks.zip
        mv sdks-master/iPhoneOS*.sdk sdks/
        rm -rf sdks-master sdks.zip

        # 验证 SDK
        ls -la $THEOS/sdks/

    - name: 🔨 Build tweak
      run: |
        # 设置环境变量
        export THEOS=$THEOS
        export PATH=$THEOS/bin:$PATH

        # 清理
        make clean || true

        # 编译
        make package

        # 验证 deb 包
        ls -lh packages/*.deb

    - name: 📋 Generate build info
      run: |
        echo "## Build Information" > build_info.txt
        echo "- Date: $(date)" >> build_info.txt
        echo "- Commit: ${{ github.sha }}" >> build_info.txt
        echo "- Branch: ${{ github.ref_name }}" >> build_info.txt
        echo "" >> build_info.txt
        echo "## Package Details" >> build_info.txt
        dpkg-deb -I packages/*.deb >> build_info.txt

    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: WatusiPatch-${{ github.sha }}
        path: |
          packages/*.deb
          build_info.txt

    - name: 🚀 Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          packages/*.deb
          build_info.txt
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📊 Upload to GitHub Releases (alternative)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./packages/*.deb
        asset_name: WatusiPatch-${{ github.ref_name }}.deb
        asset_content_type: application/vnd.debian.binary-package
